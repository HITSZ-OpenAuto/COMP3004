about_course:
  - content: |
      本课程以前是《编译原理》的一部分，20级独立出来作为一门必修课程。
      相比《算法设计与分析》、《数理逻辑》和离散数学一系列课程，《形式语言与自动机》似乎是计科培养计划里难度最大的理论计算机科学（Theoretical Computer Science）课程。
    submitter:
      name: ""
      link: ""
about_exam:
  - content: |
      考试都是基础题型，可参考exam中的试卷。
      但考试本身难度较大，因为形式语言与自动机本身有很多巧妙的构造和分析。只掌握 PPT 上的概念和例子不太能得到很高的分数，可能还需要自己找一些常见的语言文法和自动机的转换习题。
      据说 20 级挂得不多，掌握基础知识就能稳过。
    submitter:
      name: ""
      link: ""
study_advice:
  - content: "课程是很难的课程，但是过还是比较容易的。"
    submitter:
      name: ""
      link: ""
  - content: |
      作业有些班级是英文的，有些班级是中文的。
      中文的作业都是重要的基础题，尽量完全弄懂。
      英文的作业有一些十分有趣的构造和证明，网上可以搜到一些类似题目的答案。这类题目 20 级考试中并没有出现。
    submitter:
      name: ""
      link: ""
