[[sections]]
title = "关于考试"

[[sections.items]]
content = """
考试都是基础题型，参考exam中的试卷。

但考试本身难度较大，因为形式语言与自动机本身有很多巧妙的构造和分析。只掌握 PPT 上的概念和例子不太能得到很高的分数，可能还需要自己找一些常见的语言文法和自动机的转换习题。

据说 20 级挂得不多，掌握基础知识就能稳过。但 21 级变成考试课后不知道会不会有变化。

（20级得分排名参考：92分 rk1，82分 rk60/500）

26 春期末试卷比往届简单很多，基本都是比较基础的题目，且大家普遍得分也很高，但复习时仍不可掉以轻心，应确保掌握基础知识。期末复习时参考各班老师 PPT 即可，推荐看 tbz 老师的。
"""

[[sections]]
title = "关于作业"

[[sections.items]]
content = """
作业有些班级是英文的，有些班级是中文的。

中文的作业都是重要的基础题，尽量完全弄懂。

英文的作业有一些十分有趣的构造和证明，网上可以搜到一些类似题目的答案。这类题目 20 级考试中并没有出现。

在 26 春，以 tbz 老师的班级为例，共布置作业 4 次，整体难度比较低，远低于 PPT 给出的例题。不过 26 春的作业和考试的关联不大，作业仅能用于复习巩固知识点。
"""
